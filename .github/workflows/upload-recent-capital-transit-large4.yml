name: One-time recent capital and transit archive upload

on:
  push:
    branches:
      - codex/recent-capital-transit-large-4
    paths:
      - .github/workflows/upload-recent-capital-transit-large4.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: abqinfo-bucket
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - name: Download, verify, and upload exact authoritative files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          cat > manifest.tsv <<'EOF'
          src-2102f32c414369f0	421674	14b5af402872d750d6e277801b04a5c6c9d53fceb8211a614d1f8bd05282b244	transportation/transit/nmdot-fy2027-fta-5310-5311-5339-budget-awards.pdf	https://api.realfile.rtsclients.com/PublicFiles/f260a66b364d453e91ff9b3fedd494dc/e0ba7827-c51f-4aa8-96ff-b809bff6faf2/FY%202027%20FTA%20Section%205310%205311%205339%20Budget%20Awards.pdf
          src-1c5fd2f23ddfc6c2	287944	3030a3b91edc9b7c9beabfcc6c865de338bef4bd6fd15695023bfe899c843af7	transportation/traffic-operations/mrmpo-ampa-summary-statistics-2024.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/6384/2024-AMPA-Summary-Statistics-Mileage-VMT-and-VHT-PDF?bidId=
          src-be7fb993336ee3cb	400009	0f707f22a742fa4bafee01e9cdd30f3f762b25ddcf3cc132306ce12b067b7d29	transportation/traffic-operations/mrmpo-top-75-busiest-intersections-2024.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/6385/2024-Top-75-Busiest-Intersections-With-Past-Rankings-PDF?bidId=
          src-405a9389e84cc5a2	1928169	878205cd40fd3e4f43ce6338b507dc9523f5fc65dd98c856d8ba6138d477e17f	transportation/transit/rio-metro-public-transportation-agency-safety-plan-2025.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/7013/Rio-Metro-Public-Transportation-Agency-Safety-Plan-2025?bidId=
          src-93a3a19a94426b04	4449401	5a5cbd276da5eae6eaaa013386d1729d1b168e6e1698305d220e0f004d841960	transportation/transit/rail-runner/rio-metro-transit-asset-management-plan-fy2023-2026.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/7009/Rio-Metro-Transit-Asset-Management-Plan-2022?bidId=
          src-c3f76d888e9f0420	379615	60f82cd94f10b475e44038806fff8ffb2cc6cc5a077235462afd932f8ecd377c	transportation/transit/cabq-public-transportation-agency-safety-plan-2025.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/7012/City-of-Albuquerque-Public-Transportation-Agency-Safety-Plan-2025?bidId=
          src-d662cfa92401be3b	563632	afdf184b91c402110fb0154a69d203c853f52a8427a6324a93870fdb941193fe	transportation/transit/cabq-transit-asset-management-plan-2022.pdf	https://www.mrcog-nm.gov/DocumentCenter/View/7008/City-of-Albuquerque-Transit-Asset-Management-Plan-2022?bidId=
          src-2735a3a027a4ebff	114334	2f4d3e2f7b4ceab6427063f5e571a142e0f9deaf8cf2aee54a9380cc4cd71fb1	city-data/capital-spending/cabq-infrastructure-capital-improvement-plan-project-list-2026.pdf	https://www.cabq.gov/municipaldevelopment/documents/icip-2026-session.pdf
          EOF

          current=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" --query 'sum(Contents[].Size)' --output text)
          [[ "$current" == "None" ]] && current=0
          addition=8544778
          projected=$((current + addition))
          if (( projected > 8000000000 )); then
            echo "::error::Projected R2 storage $projected exceeds the 8,000,000,000-byte project gate."
            exit 1
          fi

          while IFS=$'\t' read -r id bytes expected key url; do
            file="download/$id.pdf"
            curl --fail --location --retry 3 --retry-delay 2 --output "$file" "$url"
            actual_bytes=$(stat -c '%s' "$file")
            actual_sha=$(sha256sum "$file" | cut -d ' ' -f 1)
            [[ "$actual_bytes" == "$bytes" ]] || { echo "::error::$id size mismatch"; exit 1; }
            [[ "$actual_sha" == "$expected" ]] || { echo "::error::$id SHA-256 mismatch"; exit 1; }
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::Refusing to overwrite existing object $key"
              exit 1
            fi
            aws s3 cp "$file" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --content-type application/pdf --metadata "sha256=$expected,source-id=$id" --no-progress
            aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT"
          done < manifest.tsv
